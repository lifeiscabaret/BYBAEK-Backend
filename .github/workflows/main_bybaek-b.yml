name: Build and deploy Python app to Azure Web App

# 배포 대상은 GitHub Variables/Secrets로 파라미터화되어 있습니다.
#   - vars.AZURE_WEBAPP_NAME            : 배포할 App Service 이름 (현재 bybaek-backend)
#   - secrets.AZURE_WEBAPP_PUBLISH_PROFILE : 해당 App Service의 게시 프로필(XML)
# 다른 구독/앱으로 되돌리거나 옮길 때는 위 두 값만 교체하면 됩니다 (파일 수정 불필요).

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate dependencies install
        run: pip install -r requirements.txt

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
